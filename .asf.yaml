# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Script Interpreter"
  homepage: https://maven.apache.org/shared/maven-script-interpreter/
  labels:
    - java
    - build-management
    - maven-shared
    - maven
    - hacktoberfest
  protected_branches:
    master: { }
  pull_requests:
    del_branch_on_merge: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  autolink_jira:
    - MSHARED
  features:
    issues: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-script-interpreter
project:
  metadata:
    key: maven-script-interpreter
    committee: maven
    name: Apache Maven Script Interpreter
    description: This component provides some utilities to interpret/execute some scripts for various implementations groovy or beanshell..
    short_description: This component provides some utilities to interpret/execute some scripts for various implementations groovy or beanshell.
    homepage: https://maven.apache.org/shared/maven-script-interpreter/
    download_page: https://maven.apache.org/shared/maven-script-interpreter/download.cgi
    bug_database: https://maven.apache.org/shared/maven-script-interpreter/issue-management.html
    mailing_lists: https://maven.apache.org/shared/maven-script-interpreter/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-script-interpreter.git
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    github_repository_name: maven-script-interpreter
    download_path_suffix: shared
  features:
    atr_sync: true
